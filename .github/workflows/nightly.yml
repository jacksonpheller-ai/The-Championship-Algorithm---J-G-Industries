name: J&G nightly slate

on:
  schedule:
    - cron: "41 15 * * *"   # ~10:41 ET: price the slate against morning lines
    - cron: "17 22 * * *"   # ~5:17 ET: refresh for injury news before tip-off
    - cron: "23 9 * * *"    # ~4:23 ET: grade last night's ledger
    - cron: "7 11 * * 1"    # Mondays: refit the model on the latest results
  workflow_dispatch:
    inputs:
      task:
        description: "run | grade | backtest"
        default: run

permissions:
  contents: write

concurrency:
  group: jg-nightly
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python tests/test_core.py
      - name: Pick task
        id: task
        run: |
          T="${{ github.event.inputs.task }}"
          if [ -z "$T" ]; then
            case "${{ github.event.schedule }}" in
              "23 9 * * *") T=grade ;;
              "7 11 * * 1") T=backtest ;;
              *) T=run ;;
            esac
          fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
      - name: Refit model
        if: steps.task.outputs.task == 'backtest'
        run: python -m jghedge backtest && python -m jghedge run --no-ledger
      - name: Grade ledger
        if: steps.task.outputs.task == 'grade'
        run: python -m jghedge grade && python -m jghedge site
      - name: Price tonight's slate
        if: steps.task.outputs.task == 'run'
        run: python -m jghedge run
      - name: Commit results
        run: |
          git config user.name "jg-desk-bot"
          git config user.email "jg-desk-bot@users.noreply.github.com"
          git add data docs dist
          git diff --cached --quiet || git commit -m "Desk update: ${{ steps.task.outputs.task }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
