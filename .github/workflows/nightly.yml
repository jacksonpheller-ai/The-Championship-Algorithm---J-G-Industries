name: J&G nightly slate

on:
  # Times are UTC. GitHub runs scheduled jobs only from the default branch, as the account
  # that last changed these lines; if no 'schedule' runs appear in the Actions tab, re-save
  # this file from github.com to re-register them.
  schedule:
    - cron: "31 2 * * *"    # 02:31 UTC (~9:31 pm ET): price tomorrow's slate at the OPENERS
    - cron: "41 15 * * *"   # 15:41 UTC (~10:41 am ET): morning lines + injury report
    - cron: "41 20 * * *"   # 20:41 UTC (~3:41 pm ET): pre-tip run for the 4-5 pm ET tips
    - cron: "17 22 * * *"   # 22:17 UTC (~5:17 pm ET): afternoon injury news before the main slate
    - cron: "23 9 * * *"    # 09:23 UTC (~4:23 am ET): grade last night's ledger
    - cron: "7 11 * * 1"    # Mondays: refit the model and refresh the replay (both seeds)
  workflow_dispatch:
    inputs:
      task:
        description: "run | grade | backtest"
        default: run
      label:
        description: "snapshot label for run: opener | morning | pretip | afternoon"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: jg-nightly
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python tests/run_all.py
      - name: Pick task
        id: task
        env:
          IN_TASK: ${{ github.event.inputs.task }}
          IN_LABEL: ${{ github.event.inputs.label }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          T="$IN_TASK"; L="$IN_LABEL"
          case "$T" in ""|run|grade|backtest) ;; *) echo "::error::task must be run, grade or backtest"; exit 1 ;; esac
          case "$L" in ""|opener|morning|pretip|afternoon) ;; *) echo "::error::label must be opener, morning, pretip or afternoon"; exit 1 ;; esac
          if [ -z "$T" ]; then
            case "$SCHEDULE" in
              "23 9 * * *") T=grade ;;
              "7 11 * * 1") T=backtest ;;
              *) T=run ;;
            esac
          fi
          if [ -z "$L" ]; then
            case "$SCHEDULE" in
              "31 2 * * *") L=opener ;;
              "41 15 * * *") L=morning ;;
              "41 20 * * *") L=pretip ;;
              "17 22 * * *") L=afternoon ;;
              *) L="" ;;          # manual run: the pipeline picks the label from the Eastern time
            esac
          fi
          echo "task=$T" >> "$GITHUB_OUTPUT"
          echo "label=$L" >> "$GITHUB_OUTPUT"
      - name: Refit model
        if: steps.task.outputs.task == 'backtest'
        env:
          JG_RUN_LABEL: refit
        run: python -m jghedge backtest && python -m jghedge replay --seasons 2024,2025,2026,2027 && python -m jghedge run --no-ledger
      - name: Grade ledger
        if: steps.task.outputs.task == 'grade'
        run: python -m jghedge grade && python -m jghedge ingest && python -m jghedge site
      - name: Price the slate
        if: steps.task.outputs.task == 'run'
        env:
          JG_RUN_LABEL: ${{ steps.task.outputs.label }}
        run: python -m jghedge run && python -m jghedge ingest && python -m jghedge site
      - name: Commit results
        env:
          BRANCH: ${{ github.ref_name }}
          TASK: ${{ steps.task.outputs.task }}
          LABEL: ${{ steps.task.outputs.label }}
        run: |
          git config user.name "jg-desk-bot"
          git config user.email "jg-desk-bot@users.noreply.github.com"
          git add data docs dist
          git diff --cached --quiet || git commit -m "Desk update: $TASK $LABEL $(date -u +%Y-%m-%dT%H:%MZ)"
          # another run may have pushed while this one worked: rebase onto it, keep our fresh outputs
          git pull --rebase -X theirs origin "$BRANCH" || { git rebase --abort; echo "::error::could not rebase onto $BRANCH"; exit 1; }
          git push origin "HEAD:$BRANCH"
          # keep main and the working branch identical, whichever one GitHub treats as the default
          for b in main claude/wonderful-bell-w1m2r1; do
            [ "$b" = "$BRANCH" ] && continue
            git push origin "HEAD:refs/heads/$b" || echo "::warning::$b has diverged from $BRANCH and was not updated; fast-forward it by hand"
          done
