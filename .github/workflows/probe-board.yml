name: Probe pick'em board sources

# One-off check: can GitHub's servers read PrizePicks' public board with a plain request?
# Runs only when this file changes on the development branch. Changes nothing in the repository.
on:
  push:
    branches: ["claude/determined-gates-oo6itl"]
    paths: [".github/workflows/probe-board.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Plain GET of each source
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, collections
          SOURCES = {
              "api": "https://api.prizepicks.com/projections?league_id=7&per_page=250&single_stat=true",
              "partner-api": "https://partner-api.prizepicks.com/projections?league_id=7&per_page=250",
          }
          for name, url in SOURCES.items():
              print(f"== {name}: {url}")
              req = urllib.request.Request(url, headers={"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      body = r.read()
                      print("status", r.status, "type", r.headers.get("content-type"), "bytes", len(body))
              except urllib.error.HTTPError as e:
                  body = e.read()
                  print("status", e.code, "type", e.headers.get("content-type"), "bytes", len(body))
                  print("body:", body[:300])
                  continue
              except Exception as e:
                  print("failed:", repr(e)[:300])
                  continue
              try:
                  j = json.loads(body)
              except ValueError:
                  print("not JSON:", body[:300])
                  continue
              data = j.get("data") or []
              print("projections", len(data), "included", len(j.get("included") or []), "next", (j.get("links") or {}).get("next"))
              attrs = [d.get("attributes") or {} for d in data]
              print("odds_type", dict(collections.Counter(a.get("odds_type") for a in attrs)))
              print("stat_type", dict(collections.Counter(a.get("stat_type") for a in attrs).most_common(30)))
              print("attribute keys", sorted({k for a in attrs for k in a}))
              for want in ("standard", "demon", "goblin"):
                  for d in data:
                      if (d.get("attributes") or {}).get("odds_type") == want:
                          print("sample", want, json.dumps(d)[:1500])
                          break
              print("included types", dict(collections.Counter(i.get("type") for i in (j.get("included") or []))))
          PY
